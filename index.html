function evenlySpreadEligibleDates(start,end,days,breaks){const available=availableDates(start,end,breaks);if(days<1||days>available.length)return null;if(days===1)return [available[0]];return Array.from({length:days},(_,i)=>available[Math.floor(i*(available.length-1)/(days-1))])}
function buildScheduleEntries(b){
 let entries;
 if(b.mode==='manual'){entries=manualEntries(b);if(!entries)return null}
 else if(b.mode==='oneday'||b.start===b.end){if(isBreakDay(b.start,b.breaks)){alert('У день публікації запланована перерва. Зміни дату або перерву.');return null}entries=Array.from({length:b.count},()=>({date:b.start,time:b.time}))}
 else if(b.autoEnd&&b.mode!=='manual'){
  const dates=datesOf(b.start,b.end,b.mode==='even'?'daily':b.mode,b.interval,b.custom).filter(date=>!isBreakDay(date,b.breaks));
  const rate=Math.max(1,Number(b.chaptersDaily)||1);
  if(dates.length*rate<b.count){alert('У вибраному графіку не вистачає днів для запланованої кількості розділів.');return null}
  entries=[];
  for(const date of dates){for(let k=0;k<rate&&entries.length<b.count;k++)entries.push({date,time:b.time});if(entries.length===b.count)break}
 }else if(b.mode==='even'){
  const available=availableDates(b.start,b.end,b.breaks);
  if(!available.length){alert('Немає доступних днів публікації після врахування перерв.');return null}
  const days=Math.min(b.count,available.length);
  const dates=evenlySpreadEligibleDates(b.start,b.end,days,b.breaks);
  if(!dates)return null;
  entries=[];const base=Math.floor(b.count/days),extra=b.count%days;
  dates.forEach((date,i)=>{const quantity=base+(i<extra?1:0);for(let j=0;j<quantity;j++)entries.push({date,time:b.time})});
 }else{
  const dates=datesOf(b.start,b.end,b.mode,b.interval,b.custom).filter(date=>!isBreakDay(date,b.breaks));
  if(dates.length<b.count){alert(`Після виключення перерв у графіку лише ${dates.length} дат на ${b.count} розділів. Збільш період, зміни частоту або скороти перерви.`);return null}
  entries=dates.slice(0,b.count).map(date=>({date,time:b.time}));
 }
 return entries;
}
function generate(b,rebuild){

 for(let i=0;i<entries.length;i++)db.events.push({id:uid(),bookId:b.id,chapter:i+1,date:entries[i].date,time:entries[i].time,status:'planned'});
 if(b.mode==='manual')b.count=entries.length||null;
 return true;
}
