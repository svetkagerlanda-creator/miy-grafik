const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const plus=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};const monday=d=>plus(d,-(d.getDay()+6)%7);const nice=s=>{const d=parse(s);return `${d.getDate()} ${mon[d.getMonth()]} ${d.getFullYear()}`};const html=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!db||!Array.isArray(db.books)||!Array.isArray(db.events))db={books:[],events:[]};let tab='calendar',anchor=new Date(),filter='all';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Не вдалося зберегти. Спробуй зменшити обкладинки або експортувати дані.')}};const book=id=>db.books.find(b=>b.id===id);const eventsDay=d=>db.events.filter(e=>e.date===d).sort((a,b)=>a.time.localeCompare(b.time));const published=bid=>db.events.filter(e=>e.bookId===bid&&e.status==='published').length;function datesOf(start,end,mode,interval,custom){let out=[];if(mode==='custom'){return [...new Set(custom.split(/[;,\s]+/).map(x=>x.trim()).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)&&iso(parse(x))===x&&x>=start&&x<=end))].sort()}const step=mode==='daily'?1:mode==='alternate'?2:Math.max(1,Number(interval)||1);for(let d=parse(start);iso(d)<=end;d=plus(d,step)){out.push(iso(d));if(out.length>5000)break}return out}
function render(){const start=monday(anchor),end=plus(start,6),now=new Date();$('heading').textContent=tab==='calendar'?heads[anchor.getMonth()]:({books:'Книги',today:'Сьогодні',stats:'Статистика'}[tab]);$('subtitle').textContent=tab==='books'?`${db.books.length} книг`:tab==='stats'?'Огляд публікацій':tab==='today'?nice(iso(now)):'';$('weekControls').classList.toggle('hidden',tab!=='calendar');$('todayBtn').classList.toggle('hidden',tab!=='calendar');$('rangeText').textContent=`${start.getDate()} ${start.getMonth()!==end.getMonth()?mon[start.getMonth()]+' – ': '– '}${end.getDate()} ${mon[end.getMonth()]}`;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));const content=$('content');if(tab==='calendar'){let s='<div class="week"><div class="dayhead"></div>';for(let i=0;i<7;i++){const d=plus(start,i);s+=`<div class="dayhead ${iso(d)===iso(now)?'today':''}" data-day="${iso(d)}">${d.getDate()}<small>${weekday[i]}</small></div>`}s+='</div><div class="week">';for(let h=0;h<24;h++){s+=`<div class="hourlabel">${h}</div>`;for(let i=0;i<7;i++){const day=iso(plus(start,i)),ev=eventsDay(day).filter(e=>Number(e.time.slice(0,2))===h);s+=`<div class="cell" data-day="${day}" data-hour="${h}">`;ev.slice(0,3).forEach(e=>{const b=book(e.bookId);if(b)s+=`<button class="event" style="background:${b.color}" data-event="${e.id}"><b>${html(e.time)} · ${html(b.title)}</b>Розділ ${e.chapter}${e.status==='published'?' ✓':''}</button>`});if(ev.length>3)s+=`<button class="event more" data-open-day="${day}">+${ev.length-3} ще</button>`;s+='</div>'}}content.innerHTML=s+'</div>';content.querySelectorAll('[data-event]').forEach(x=>x.onclick=()=>eventDialog(x.dataset.event));content.querySelectorAll('[data-open-day]').forEach(x=>x.onclick=()=>dayDialog(x.dataset.openDay));content.querySelectorAll('.dayhead[data-day]').forEach(x=>x.onclick=()=>dayDialog(x.dataset.day));content.querySelectorAll('.cell').forEach(x=>x.ondblclick=()=>dayDialog(x.dataset.day))}
if(tab==='books'){content.innerHTML=`<div class="pane"><input class="search" id="searchBooks" placeholder="Пошук книги"><div class="chips"><button class="chip ${filter==='all'?'active':''}" data-filter="all">Усі</button><button class="chip ${filter==='active'?'active':''}" data-filter="active">Активні</button><button class="chip ${filter==='finished'?'active':''}" data-filter="finished">Завершені</button></div></div><div class="list" id="bookList"></div>`;content.querySelectorAll('[data-filter]').forEach(x=>x.onclick=()=>{filter=x.dataset.filter;render()});$('searchBooks').oninput=renderBooks;renderBooks()}
if(tab==='today'){const ev=eventsDay(iso(now));content.innerHTML=`<div class="pane"><div class="chips"><span class="chip active">📚 ${ev.length} публікацій</span><span class="chip">✓ ${ev.filter(x=>x.status==='published').length} опубліковано</span></div>${ev.length?ev.map(e=>{let b=book(e.bookId);return b?`<div class="todaycard" style="border-left-color:${b.color}"><div class="flex"><h3>${html(b.title)}</h3><b>${e.time}</b></div><p>Розділ ${e.chapter} · ${e.status==='published'?'Опубліковано':'Заплановано'}</p><button data-event="${e.id}">Відкрити публікацію</button></div>`:''}).join(''):'<div class="empty">Сьогодні публікацій немає.</div>'}</div>`;content.querySelectorAll('[data-event]').forEach(x=>x.onclick=()=>eventDialog(x.dataset.event))}

function renderBooks(){const q=$('searchBooks')?.value.toLocaleLowerCase('uk')||'',arr=db.books.filter(b=>b.title.toLocaleLowerCase('uk').includes(q)&&(filter==='all'||(filter==='finished'?db.events.filter(e=>e.bookId===b.id).length>0&&db.events.filter(e=>e.bookId===b.id).every(e=>e.status==='published'):db.events.some(e=>e.bookId===b.id&&e.status!=='published'))));$('bookList').innerHTML=arr.length?arr.map(b=>{const es=db.events.filter(e=>e.bookId===b.id),p=published(b.id);return `<div class="item" data-book="${b.id}"><div class="cover" style="background:${b.color}20">${b.cover?`<img src="${b.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:7px" alt="">`:'📖'}</div><div class="info"><h3>${html(b.title)}</h3><p>${nice(b.start)} – ${nice(b.end)}</p><p>${p}/${es.length} розділів · ${html(b.time)}</p><div class="progress"><span style="background:${b.color};width:${es.length?100*p/es.length:0}%"></span></div></div><span style="color:${b.color}">›</span></div>`}).join(''):'<div class="empty">Книг поки немає. Натисни +, щоб додати першу.</div>';$('bookList').querySelectorAll('[data-book]').forEach(x=>x.onclick=()=>bookDialog(x.dataset.book))}

function bookDialog(id){const b=id?book(id):null;const form=`<h2>${b?'Редагувати книгу':'Нова книга'}</h2><form id="bookForm"><div class="field"><label>Назва книги</label><input name="title" required maxlength="160" value="${html(b?.title||'')}"></div><div class="twocol"><div class="field"><label>Дата початку</label><input name="start" type="date" required value="${b?.start||iso(new Date())}"></div><div class="field"><label>Дата завершення</label><input name="end" type="date" required value="${b?.end||iso(plus(new Date(),60))}"></div></div><div class="twocol"><div class="field"><label>Кількість розділів</label><input name="count" type="number" min="1" max="3000" required value="${b?.count||30}"></div><div class="field"><label>Час публікації</label><input name="time" type="time" required value="${b?.time||'19:00'}"></div></div><div class="field"><label>Частота виходу</label><select name="mode"><option value="daily">Кожен день</option><option value="alternate">Через день</option><option value="custom">Свій графік — конкретні дати</option><option value="interval">Свій графік — кожні N днів</option></select></div><div class="field" id="intervalField"><label>Кожні скільки днів?</label><input name="interval" type="number" min="1" value="${b?.interval||3}"></div><div class="field" id="customField"><label>Дати у форматі РРРР-ММ-ДД, через кому або з нового рядка</label><textarea name="custom" rows="4" placeholder="2027-05-01, 2027-05-04">${html(b?.custom||'')}</textarea></div><div class="twocol"><div class="field"><label>Колір книги</label><div class="colorpicker-row"><span id="bookColorPreview" class="colorpreview" style="background:${b?.color||colors[db.books.length%colors.length]}"></span><select name="color" aria-label="Колір книги">${colorPalette.map(([label,code])=>`<option value="${code}" ${code===(b?.color||colors[db.books.length%colors.length])?'selected':''}>${label}</option>`).join('')}${b?.color&&!colors.includes(b.color)?`<option value="${b.color}" selected>Раніше вибраний (${b.color})</option>`:''} </select></div></div><div class="field"><label>Обкладинка (необов'язково)</label><input type="file" id="coverFile" accept="image/*"></div></div><div class="note">Автоматично створимо публікації за обраним графіком. Якщо дат недостатньо, попередимо. При редагуванні книги існуючі глави зберігаються, якщо не натиснути «Перебудувати графік».</div><div class="buttons"><button type="button" class="ghost" data-close>Скасувати</button><button class="primary">${b?'Зберегти зміни':'Додати книгу'}</button></div></form>${b?`<div class="buttons"><button class="ghost" id="rebuild">Перебудувати графік</button><button class="danger" id="removeBook">Видалити книгу</button></div><h3>Публікації</h3><div id="bookEvents"></div>`:''}`;overlay(form);const f=$('bookForm');f.elements.color.onchange=()=>{$('bookColorPreview').style.background=f.elements.color.value};f.elements.mode.value=b?.mode||'alternate';const show=()=>{$('intervalField').classList.toggle('hidden',f.elements.mode.value!=='interval');$('customField').classList.toggle('hidden',f.elements.mode.value!=='custom')};f.elements.mode.onchange=show;show();if(b){$('bookEvents').innerHTML=db.events.filter(e=>e.bookId===b.id).sort((a,c)=>a.chapter-c.chapter).map(e=>`<div class="item" data-ev="${e.id}"><span class="dot" style="background:${b.color}"></span><div class="info"><b>Розділ ${e.chapter}</b><p>${nice(e.date)} · ${e.time} · ${e.status==='published'?'Опубліковано':'Заплановано'}</p></div>›</div>`).join('');$('bookEvents').querySelectorAll('[data-ev]').forEach(x=>x.onclick=()=>eventDialog(x.dataset.ev));$('removeBook').onclick=()=>{if(confirm(`Видалити «${b.title}» та всі її публікації?`)){db.books=db.books.filter(x=>x.id!==b.id);db.events=db.events.filter(x=>x.bookId!==b.id);save();close();render()}};$('rebuild').onclick=()=>{if(confirm('Перебудова видалить усі індивідуальні зміни дат і статусів цієї книги. Продовжити?')){const data=readForm();if(!data)return;if(generate(data,true)){Object.assign(b,data);save();close();render()}}}}f.onsubmit=async e=>{e.preventDefault();const data=readForm();if(!data)return;const file=$('coverFile').files[0];if(file){if(file.size>2*1024*1024){alert('Обкладинка має бути до 2 МБ');return}data.cover=await readImage(file)}else if(b)data.cover=b.cover||'';if(b){Object.assign(b,data);save();close();render()}else{data.id=uid();if(!generate(data,false))return;db.books.push(data);save();close();tab='books';render()}};function readForm(){const v=f.elements;const data={title:v.title.value.trim(),start:v.start.value,end:v.end.value,count:Number(v.count.value),time:v.time.value,mode:v.mode.value,interval:Number(v.interval.value),custom:v.custom.value,color:v.color.value};if(!data.title||!data.start||!data.end||data.end<data.start||!data.time){alert('Перевір назву, дати й час. Дата завершення має бути не раніше початку.');return null}return data}}
function generate(b,rebuild){const dates=datesOf(b.start,b.end,b.mode,b.interval,b.custom);if(dates.length<b.count){alert(`У графіку лише ${dates.length} дат на ${b.count} розділів. Збільш період, зміни частоту або додай дати.`);return false}if(rebuild)db.events=db.events.filter(e=>e.bookId!==b.id);for(let i=0;i<b.count;i++)db.events.push({id:uid(),bookId:b.id,chapter:i+1,date:dates[i],time:b.time,status:'planned'});return true}
function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function eventDialog(id){const e=db.events.find(x=>x.id===id);if(!e)return;const b=book(e.bookId);overlay(`<h2>${html(b?.title||'Книга')} — розділ ${e.chapter}</h2><form id="eventForm"><div class="twocol"><div class="field"><label>Дата публікації</label><input type="date" name="date" required value="${e.date}"></div><div class="field"><label>Час публікації</label><input type="time" name="time" required value="${e.time}"></div></div><div class="field"><label>Статус</label><select name="status"><option value="planned">Заплановано</option><option value="published">Опубліковано</option></select></div><div class="buttons"><button type="button" class="ghost" data-close>Назад</button><button type="submit" class="primary">Зберегти</button></div></form>`);const f=$('eventForm');f.elements.status.value=e.status;f.onsubmit=x=>{x.preventDefault();e.date=f.elements.date.value;e.time=f.elements.time.value;e.status=f.elements.status.value;save();close();render()}}
function dayDialog(date){const ev=eventsDay(date);overlay(`<h2>${nice(date)}</h2><div class="chips"><span class="chip active">${ev.length} публікацій</span></div>${ev.length?ev.map(e=>`<div class="item" data-ev="${e.id}"><span class="dot" style="background:${book(e.bookId)?.color||'#0d9488'}"></span><div class="info"><b>${html(book(e.bookId)?.title||'Книга')}</b><p>${e.time} · Розділ ${e.chapter}${e.status==='published'?' · ✓ Опубліковано':''}</p></div>›</div>`).join(''):'<div class="empty">Публікацій немає</div>'}<div class="buttons"><button class="ghost" data-close>Закрити</button></div>`);$('overlay').querySelectorAll('[data-ev]').forEach(x=>x.onclick=()=>eventDialog(x.dataset.ev))}
$('prevBtn').onclick=()=>{anchor=plus(anchor,-7);render()};$('nextBtn').onclick=()=>{anchor=plus(anchor,7);render()};$('todayBtn').onclick=()=>{anchor=new Date();render()};$('newBtn').onclick=()=>bookDialog();document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});$('menuBtn').onclick=()=>{overlay(`<h2>Налаштування</h2><p class="sub">Дані зберігаються тільки у цьому браузері на цьому пристрої. Для перенесення між пристроями роби резервні копії.</p><div class="buttons"><button class="primary" id="exportBtn">Експорт JSON</button><button class="ghost" id="importBtn">Імпорт JSON</button></div><div class="buttons"><button class="ghost" id="csvBtn">Експорт CSV</button></div><div class="buttons"><button class="ghost" data-close>Закрити</button></div>`);$('exportBtn').onclick=()=>download('miy-grafik-backup.json',JSON.stringify(db,null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();$('csvBtn').onclick=()=>{const lines=[['Книга','Розділ','Дата','Час','Статус'],...db.events.map(e=>[book(e.bookId)?.title||'',e.chapter,e.date,e.time,e.status])];download('miy-grafik.csv','\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}};$('importFile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.books)||!Array.isArray(data.events)||!data.books.every(b=>b.id&&b.title)||!data.events.every(e=>e.bookId&&e.date)){throw Error('Неправильний формат')}if(confirm('Замінити всі поточні дані в застосунку даними з файлу?')){db=data;save();close();render()}}catch(e){alert('Не вдалося імпортувати: '+e.message)}ev.target.value=''};function download(name,data,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
