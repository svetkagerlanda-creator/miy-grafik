<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8052bf"><title>Моя колекція</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;--bg:#f1ebfa;--card:#fff;--ink:#35204d;--muted:#79698a;--accent:#8052bf;--line:#dcd0e9;--soft:#e8dff5}
body[data-theme=light]{--bg:#f6f7fa;--card:#fff;--ink:#242834;--muted:#687386;--accent:#59667b;--line:#e0e4ea;--soft:#edf0f3}
body[data-theme=dark]{--bg:#16141c;--card:#25212e;--ink:#f4effb;--muted:#b9acc8;--accent:#b391ee;--line:#453c52;--soft:#342b41}
body[data-theme=mint]{--bg:#e8f8f1;--card:#fff;--ink:#194b3b;--muted:#628377;--accent:#238f73;--line:#c8e8da;--soft:#d8f1e6}
body[data-theme=pink]{--bg:#fff0f6;--card:#fff;--ink:#6c3450;--muted:#a37689;--accent:#d4629c;--line:#f0cada;--soft:#ffe0ef}
body[data-theme=blue]{--bg:#eaf4ff;--card:#fff;--ink:#264c73;--muted:#6a8da8;--accent:#3987c3;--line:#cde3f7;--soft:#dceeff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{background:var(--card);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:9px}.logo{font-size:24px;font-weight:850;padding:5px 12px 20px}.small{font-size:12px;color:var(--muted)}.side button,.bottom button{border:0;background:transparent;color:var(--ink);text-align:left;padding:13px;border-radius:12px}.side button.active,.bottom button.active{background:var(--soft);color:var(--accent);font-weight:700}.side button:hover,.ghost:hover{background:var(--soft)}.sidefoot{margin-top:auto;padding:12px}.main{min-width:0;max-width:1240px;width:100%;margin:0 auto;padding:28px 30px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px;flex-wrap:wrap}h1{margin:0;font-size:30px}h2{font-size:20px;margin:24px 0 12px}h3{margin:3px 0 9px}.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;font-weight:700}.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 13px}.danger{color:#be4355}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.space{justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{font-size:27px;font-weight:800;margin-top:7px}.folder,.item{cursor:pointer;transition:transform .15s}.folder:hover,.item:hover{transform:translateY(-2px)}.folderpic,.image{height:145px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}.image img,.folderpic img{width:100%;height:100%;object-fit:contain}.item .image{height:190px}.label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tag{display:inline-block;padding:5px 9px;border-radius:15px;background:var(--soft);color:var(--accent);font-size:12px}.muted{color:var(--muted)}.bar{height:8px;border-radius:20px;background:var(--soft);overflow:hidden;margin-top:10px}.bar>div{height:100%;background:var(--accent)}.modalcover{position:fixed;inset:0;background:#0009;z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}.modal{background:var(--card);color:var(--ink);width:min(590px,100%);max-height:92vh;overflow-y:auto;padding:22px;border-radius:19px}.dialogtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.hidden{display:none!important}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.toolbar .field{flex:1;min-width:160px}.bottom{display:none}.crumb{margin-bottom:12px}.empty{text-align:center;padding:38px;background:var(--card);border:1px dashed var(--line);border-radius:18px}.photosmall{width:70px;height:70px;object-fit:contain;background:var(--soft);border-radius:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}td button{white-space:nowrap}.notice{background:var(--soft);padding:12px;border-radius:11px;color:var(--ink);font-size:13px}#toast{position:fixed;right:20px;bottom:25px;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:12px;z-index:60;display:none}
@media(max-width:850px){.shell{display:block}.side{display:none}.main{padding:19px 14px 100px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);z-index:20;padding:8px 3px max(8px,env(safe-area-inset-bottom))}.bottom button{font-size:11px;text-align:center;padding:8px 5px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:12px}.item .image{height:155px}.two{grid-template-columns:1fr}.top h1{font-size:24px}}
</style></head><body data-theme="purple"><div class="shell"><aside class="side"><div class="logo">💜 Моя колекція<div class="small">Персональний цифровий музей</div></div><nav id="sideNav" class="stack"></nav><div class="sidefoot small">Версія <b>0.1.0</b><br>Дані зберігаються на цьому пристрої</div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Головна</h1><div id="subtitle" class="small">Колекція під твоїм контролем</div></div><div class="row"><button class="ghost" id="share">↗ Поділитися</button><button class="btn" id="addBtn">+ Додати</button></div></div><div id="root"></div></main></div><nav id="bottomNav" class="bottom"></nav><div id="overlay" class="hidden"></div><div id="toast" role="status"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
const VERSION='0.1.0', DBNAME='moya-kolektsiya-db', STORE='data';
const nav=[['home','⌂','Головна'],['folders','▣','Колекції'],['wishlist','♡','Бажанки'],['search','⌕','Пошук'],['stats','▥','Статистика'],['settings','⚙','Налаштування']];
const themes=[['purple','Фіолетова'],['light','Світла'],['dark','Темна'],['mint',"М’ятна"],['pink','Рожева'],['blue','Блакитна']];
let db, state={folders:[],items:[],settings:{theme:'purple',currency:'UAH'}},page='home',folderId=null,editId=null,view='cards',query='',filter='all';
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n===null||n===undefined||n===''?'—':Number(n).toLocaleString('uk-UA',{maximumFractionDigits:2})+' '+state.settings.currency;
const toast=s=>{ $('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2900)};
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function readDB(){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readonly'),r=t.objectStore(STORE).get('all');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function save(){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'all');t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function descendants(id){let ids=[id],next=0;while(next<ids.length){let children=state.folders.filter(f=>f.parentId===ids[next++]);ids.push(...children.map(f=>f.id))}return ids}
function folderName(id){return state.folders.find(f=>f.id===id)?.name||'Без папки'}
function owned(i){return i.status==='owned'&&Number(i.quantity)>0}
function stats(items){let have=items.filter(owned),catalog=items.length;let paid=have.filter(i=>i.purchasePrice!==''&&i.purchasePrice!=null),valued=have.filter(i=>i.marketPrice!==''&&i.marketPrice!=null);return{have:have.length,total:catalog,cost:paid.reduce((s,i)=>s+Number(i.purchasePrice)*Number(i.quantity||1),0),value:valued.reduce((s,i)=>s+Number(i.marketPrice)*Number(i.quantity||1),0),valued:valued.length}}
function setPage(p,id){page=p;if(p==='folders'&&id!==undefined)folderId=id;render();window.scrollTo(0,0)}
function render(){document.body.dataset.theme=state.settings.theme;$('pageTitle').textContent=nav.find(x=>x[0]===page)?.[2]||'Моя колекція';
for(let target of ['sideNav','bottomNav'])$(target).innerHTML=nav.map(n=>'<button class="'+(page===n[0]?'active':'')+'" data-page="'+n[0]+'">'+n[1]+' '+n[2]+'</button>').join('');
$('subtitle').textContent=page==='folders'&&folderId?folderName(folderId):'Персональний цифровий музей · v'+VERSION;
let fn={home:home,folders:folders,wishlist:wishlist,search:search,stats:statistics,settings:settings};$('root').innerHTML=fn[page]();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));wire();}
function cardItem(i){return '<article class="card item" data-openitem="'+esc(i.id)+'"><div class="image">'+(i.photo?'<img alt="" src="'+esc(i.photo)+'">':'📦')+'</div><div style="margin-top:10px"><b>'+esc(i.name)+'</b><div class="small">'+esc(i.figureNumber||'Без номера')+' · '+esc(i.manufacturer||'Виробник не вказаний')+'</div><div class="row space" style="margin-top:8px"><span class="tag">'+({owned:'✓ Маю',wish:'♡ Хочу',ordered:'🚚 Замовлено',skip:'— Не цікавить'}[i.status]||'Немає')+'</span><span class="small">'+esc(i.year||'')+'</span></div></div></article>'}
function folderCard(f){let ids=descendants(f.id),arr=state.items.filter(i=>ids.includes(i.folderId)),s=stats(arr);return '<article class="card folder" data-folder="'+esc(f.id)+'"><div class="folderpic">'+(f.photo?'<img alt="" src="'+esc(f.photo)+'">':'📁')+'</div><h3 style="margin-top:10px">'+esc(f.name)+'</h3><div class="small">'+s.have+' / '+s.total+' у наявності</div><div class="bar"><div style="width:'+(s.total?100*s.have/s.total:0)+'%"></div></div></article>'}
function home(){let s=stats(state.items),recent=state.items.filter(owned).slice().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4);return '<div class="stats">'+[['📦','Маю',s.have],['▣','Папок',state.folders.length],['♡','Бажанки',state.items.filter(i=>i.status==='wish').length],['₴','Ринкова вартість',money(s.value)]].map(a=>'<div class="card"><span class="small">'+a[0]+' '+a[1]+'</span><div class="metric">'+esc(a[2])+'</div></div>').join('')+'</div><h2>Швидкі дії</h2><div class="toolbar"><button class="btn" data-action="new-item">+ Предмет</button><button class="ghost" data-action="new-folder">+ Папка</button><button class="ghost" data-action="scan">▤ Сканувати</button><button class="ghost" data-action="backup">↓ Копія</button></div><h2>Колекції</h2><div class="grid">'+state.folders.filter(f=>!f.parentId).map(folderCard).join('')+'</div>'+(state.folders.length?'':'<div class="empty">Поки немає папок. Створи першу серію!</div>')+'<h2>Нещодавні предмети</h2><div class="grid">'+recent.map(cardItem).join('')+'</div>'}
function folderSelect(selected,except){return '<option value="">— Без папки —</option>'+state.folders.filter(f=>f.id!==except&&!descendants(except||'__none').includes(f.id)).map(f=>'<option value="'+esc(f.id)+'" '+(f.id===selected?'selected':'')+'>'+esc(f.name)+'</option>').join('')}
function folders(){let current=state.folders.find(f=>f.id===folderId);if(folderId&&!current)folderId=null;let siblings=state.folders.filter(f=>f.parentId===folderId),items=state.items.filter(i=>i.folderId===folderId&&(!query||[i.name,i.figureNumber,i.manufacturer].join(' ').toLowerCase().includes(query.toLowerCase())));return '<div class="row space crumb"><div class="row"><button class="ghost" data-action="up">← '+(folderId?'Назад':'Корінь')+'</button><b>'+esc(current?.name||'Усі колекції')+'</b></div><div class="row"><button class="ghost" data-action="new-folder">+ Папка</button><button class="btn" data-action="new-item">+ Предмет</button>'+(current?'<button class="ghost" data-action="edit-folder">✎ Папка</button>':'')+'</div></div><div class="grid">'+siblings.map(folderCard).join('')+'</div><h2>Предмети ('+items.length+')</h2><div class="toolbar"><input class="field" id="localSearch" placeholder="Пошук за назвою, номером, виробником" value="'+esc(query)+'"><button class="ghost" data-action="toggle-view">'+(view==='cards'?'☷ Таблиця':'▦ Картки')+'</button><button class="ghost" data-action="checklist">☑ Чекліст</button></div>'+renderItems(items)}
function renderItems(items){return !items.length?'<div class="empty">Тут поки немає предметів</div>':view==='cards'?'<div class="grid">'+items.map(cardItem).join('')+'</div>':'<div class="tablewrap"><table><thead><tr><th>Назва</th><th>№ фігурки</th><th>№ серії</th><th>Наявність</th><th>Кількість</th><th>Ринкова ціна</th></tr></thead><tbody>'+items.map(i=>'<tr data-openitem="'+esc(i.id)+'" style="cursor:pointer"><td>'+esc(i.name)+'</td><td>'+esc(i.figureNumber)+'</td><td>'+esc(i.seriesNumber)+'</td><td>'+esc(i.status)+'</td><td>'+esc(i.quantity)+'</td><td>'+money(i.marketPrice)+'</td></tr>').join('')+'</tbody></table></div>'}
function wishlist(){return '<h2>Хочу придбати</h2>'+renderItems(state.items.filter(i=>i.status==='wish'))+'<h2>Замовлено</h2>'+renderItems(state.items.filter(i=>i.status==='ordered'))}
function search(){let list=state.items.filter(i=>[i.name,i.figureNumber,i.seriesNumber,i.manufacturer].join(' ').toLowerCase().includes(query.toLowerCase()));return '<div class="notice">Пошук у власному каталозі працює офлайн. Зовнішній універсальний пошук Funko й ринкових цін вимагатиме перевірених API; результати не вигадуються.</div><div class="toolbar" style="margin-top:15px"><input id="globalSearch" class="field" placeholder="Назва, номер, виробник…" value="'+esc(query)+'"><button class="ghost" data-action="external">Шукати в інтернеті ↗</button></div>'+renderItems(list)}
function statistics(){let s=stats(state.items),pct=s.total?Math.round(100*s.have/s.total):0;return '<div class="stats">'+[['Позицій у каталозі',s.total],['У наявності',s.have],['Витрачено',money(s.cost)],['Оцінено на ринку',money(s.value)]].map(x=>'<div class="card"><div class="small">'+x[0]+'</div><div class="metric">'+esc(x[1])+'</div></div>').join('')+'</div><div class="card" style="margin-top:16px"><b>Зібрано '+pct+'%</b><div class="bar"><div style="width:'+pct+'%"></div></div><p class="small">Ринкова оцінка є для '+s.valued+' наявних позицій. Позиції без ціни не включено до загальної оцінки.</p></div><h2>За серіями</h2><div class="grid">'+state.folders.filter(f=>!f.parentId).map(folderCard).join('')+'</div>'}
function settings(){return '<div class="card stack"><h2 style="margin:0">Оформлення</h2><label><span class="label">Тема</span><select class="field" id="theme">'+themes.map(t=>'<option value="'+t[0]+'" '+(state.settings.theme===t[0]?'selected':'')+'>'+t[1]+'</option>').join('')+'</select></label><label><span class="label">Валюта</span><select class="field" id="currency">'+['UAH','USD','EUR','PLN'].map(c=>'<option '+(state.settings.currency===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><hr style="width:100%;border:0;border-top:1px solid var(--line)"><h2 style="margin:0">Дані та копії</h2><div class="row"><button class="btn" data-action="backup">↓ Експорт JSON з фото</button><button class="ghost" data-action="import">↑ Імпорт копії</button></div><div class="notice">Фото зберігаються у локальній базі та включаються в резервну копію. Не очищуй дані браузера без експорту. Синхронізації між пристроями немає.</div><hr style="width:100%;border:0;border-top:1px solid var(--line)"><h2 style="margin:0">Про застосунок</h2><div>Моя колекція · версія <b>'+VERSION+'</b></div><button class="ghost" data-action="share">↗ Поділитися застосунком</button><div class="small">Застосунок персональний, а посилання не відкриває твій каталог іншим людям.</div></div>'}
function showModal(title,body,buttons){$('overlay').className='modalcover';$('overlay').innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="dialogtop"><h2 style="margin:0">'+esc(title)+'</h2><button class="ghost" id="closeModal">✕</button></div>'+body+'</div>';$('closeModal').onclick=closeModal}
function closeModal(){$('overlay').className='hidden';$('overlay').innerHTML=''}
function field(name,label,value='',type='text'){return '<label><span class="label">'+label+'</span><input class="field" name="'+name+'" type="'+type+'" value="'+esc(value??'')+'"></label>'}
function folderForm(id){let f=state.folders.find(x=>x.id===id)||{};showModal(id?'Редагувати папку':'Нова папка','<form id="folderForm" class="stack">'+field('name','Назва папки *',f.name||'')+'<label><span class="label">У якій папці</span><select name="parentId" class="field">'+folderSelect(f.parentId??folderId,id)+'</select></label><label><span class="label">Фото обкладинки</span><input type="file" name="photo" accept="image/*" class="field"></label>'+(f.photo?'<img class="photosmall" alt="Обкладинка" src="'+esc(f.photo)+'">':'')+'<div class="row"><button class="btn" type="submit">Зберегти</button>'+(id?'<button class="ghost danger" type="button" id="deleteFolder">Видалити папку</button>':'')+'</div></form>');$('folderForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),photo=fd.get('photo');let obj={...f,id:id||uid(),name:String(fd.get('name')).trim(),parentId:fd.get('parentId')||null,photo:f.photo||''};if(!obj.name)return toast('Вкажи назву');if(photo?.size)obj.photo=await imageData(photo);if(id)Object.assign(f,obj);else state.folders.push(obj);await save();closeModal();render();toast('Папку збережено')};if(id)$('deleteFolder').onclick=async()=>{let ids=descendants(id),count=state.items.filter(i=>ids.includes(i.folderId)).length;if(!confirm('Видалити папку, підпапки й '+count+' предметів?'))return;state.folders=state.folders.filter(f=>!ids.includes(f.id));state.items=state.items.filter(i=>!ids.includes(i.folderId));folderId=null;await save();closeModal();render()}}
function imageData(file){return new Promise((resolve,reject)=>{if(file.size>6*1024*1024)return reject(Error('Фото завелике (макс. 6 МБ)'));let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(Error('Помилка фото'));fr.readAsDataURL(file)})}
function itemForm(id){let i=state.items.find(x=>x.id===id)||{status:'wish',quantity:0,condition:'unknown',folderId:folderId||'',history:[]};editId=id;showModal(id?'Редагувати предмет':'Новий предмет','<form id="itemForm" class="stack">'+field('name','Назва *',i.name||'')+'<div class="two">'+field('figureNumber','Номер фігурки',i.figureNumber||'')+field('seriesNumber','Номер серії',i.seriesNumber||'')+'</div>'+field('manufacturer','Виробник',i.manufacturer||'')+'<label><span class="label">Папка / серія</span><select class="field" name="folderId">'+folderSelect(i.folderId)+'</select></label><div class="two">'+field('quantity','Кількість',i.quantity??0,'number')+field('year','Рік випуску',i.year||'','number')+'</div><div class="two"><label><span class="label">Наявність</span><select name="status" class="field">'+[['owned','Маю'],['wish','Хочу'],['ordered','Замовлено'],['skip','Не цікавить']].map(s=>'<option value="'+s[0]+'" '+(i.status===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></label><label><span class="label">Стан</span><select class="field" name="condition">'+[['unknown','Не вказано'],['new','Новий'],['excellent','Відмінний'],['good','Хороший'],['damaged','З дефектами']].map(s=>'<option value="'+s[0]+'" '+(i.condition===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></label></div><div class="two">'+field('purchasePrice','Ціна придбання / шт.',i.purchasePrice??'','number')+field('marketPrice','Ринкова ціна / шт.',i.marketPrice??'','number')+'</div><label><span class="label">Фото</span><input class="field" type="file" name="photo" accept="image/*"></label>'+(i.photo?'<img class="photosmall" alt="Фото предмета" src="'+esc(i.photo)+'">':'')+'<div class="row"><button class="btn" type="submit">Зберегти</button>'+(id?'<button class="ghost danger" type="button" id="deleteItem">Видалити</button><button class="ghost" type="button" id="historyItem">Історія цін</button>':'')+'</div></form>');
$('itemForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),photo=fd.get('photo'),obj={...i,id:id||uid(),updatedAt:new Date().toISOString(),history:i.history||[]};for(let key of ['name','figureNumber','seriesNumber','manufacturer','folderId','year','status','condition'])obj[key]=String(fd.get(key)||'').trim();if(!obj.name)return toast('Вкажи назву');obj.quantity=Math.max(0,Number(fd.get('quantity')||0));for(let key of ['purchasePrice','marketPrice']){let v=fd.get(key);obj[key]=v===''?'':Math.max(0,Number(v))}if(obj.status==='owned'&&obj.quantity===0)obj.quantity=1;if(photo?.size){try{obj.photo=await imageData(photo)}catch(e){return toast(e.message)}}if(obj.marketPrice!==''&&String(obj.marketPrice)!==String(i.marketPrice))obj.history.push({date:new Date().toISOString().slice(0,10),price:obj.marketPrice,source:'Ручне оновлення'});if(id)Object.assign(i,obj);else state.items.push(obj);await save();closeModal();render();toast('Предмет збережено')};if(id){$('deleteItem').onclick=async()=>{if(!confirm('Видалити цей предмет?'))return;state.items=state.items.filter(x=>x.id!==id);await save();closeModal();render()};$('historyItem').onclick=()=>historyModal(id)}}
function historyModal(id){let item=state.items.find(i=>i.id===id);showModal('Історія ринкової ціни','<div class="stack"><b>'+esc(item.name)+'</b><div class="small">Історія попередніх оцінок</div>'+(item.history||[]).map(h=>'<div class="card">'+esc(h.date)+' · '+money(h.price)+' · '+esc(h.source||'Ручне оновлення')+'</div>').join('')+'<form id="historyForm" class="stack">'+field('date','Дата',new Date().toISOString().slice(0,10),'date')+field('price','Ринкова ціна',item.marketPrice??'','number')+field('source','Джерело / примітка','Ручна оцінка')+'<button class="btn">Зберегти оцінку</button></form></div>');$('historyForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),p=fd.get('price');if(p==='')return toast('Вкажи ціну');let obj={date:fd.get('date'),price:Math.max(0,Number(p)),source:String(fd.get('source')||'Ручна оцінка')};item.history??=[];item.history.push(obj);item.history.sort((a,b)=>a.date.localeCompare(b.date));item.marketPrice=obj.price;await save();closeModal();render();toast('Оцінку збережено')}}
function checklist(){let ids=folderId?descendants(folderId):state.folders.map(f=>f.id);let items=state.items.filter(i=>!owned(i)&&(!folderId||ids.includes(i.folderId)));showModal('Відсутні предмети','<div class="small">Список на основі збережених позицій каталогу</div><div class="stack">'+items.map(i=>'<div>☐ '+esc(i.name)+' · № '+esc(i.figureNumber||'—')+'</div>').join('')+'</div><p><button class="btn" id="copyChecklist">Копіювати чекліст</button></p>');$('copyChecklist').onclick=()=>{navigator.clipboard?.writeText(items.map(i=>'☐ '+i.name+' · № '+(i.figureNumber||'—')).join('\n')).then(()=>toast('Скопійовано')).catch(()=>toast('Не вдалося скопіювати'))}}
async function backup(){let data=JSON.stringify({app:'moya-kolektsiya',version:VERSION,exportedAt:new Date().toISOString(),data:state});let url=URL.createObjectURL(new Blob([data],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='moya-kolektsiya-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Копію з фотографіями створено')}
function importBackup(){ $('importFile').click()}
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='moya-kolektsiya'||!Array.isArray(d.data?.folders)||!Array.isArray(d.data?.items))throw Error('Неправильний формат копії');if(!confirm('Замінити ВСІ поточні папки та предмети даними з копії?'))return;state={folders:d.data.folders,items:d.data.items,settings:{theme:'purple',currency:'UAH',...d.data.settings}};await save();folderId=null;setPage('home');toast('Копію відновлено')}catch(err){toast('Помилка імпорту: '+err.message)}finally{e.target.value=''}};
async function share(){if(navigator.share){try{await navigator.share({title:'Моя колекція',text:'Персональний каталог колекціонера',url:location.href});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard){await navigator.clipboard.writeText(location.href);toast('Посилання скопійовано')}else toast('Адреса: '+location.href)}
function scan(){showModal('Сканер штрихкодів','<video id="camera" autoplay playsinline style="width:100%;max-height:270px;background:#111;border-radius:12px"></video><p class="small" id="scanMsg">Для сканування потрібна камера, HTTPS і підтримка BarcodeDetector. Можна також ввести номер вручну.</p>'+field('barcode','Штрихкод / номер','')+'<div class="row" style="margin-top:12px"><button class="btn" id="findBarcode">Знайти</button><button class="ghost" id="cameraStart">Увімкнути камеру</button></div>');$('findBarcode').onclick=()=>{let v=document.querySelector('input[name=barcode]').value.trim();if(!v)return;let found=state.items.find(i=>i.figureNumber===v||i.barcode===v);closeModal();if(found)itemForm(found.id);else{itemForm();document.querySelector('input[name=figureNumber]').value=v;toast('Не знайдено в локальному каталозі — заповни картку')}};$('cameraStart').onclick=async()=>{if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia)return toast('Сканер недоступний: введи номер вручну');try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),video=$('camera');video.srcObject=stream;let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});let interval=setInterval(async()=>{if(!document.contains(video)){clearInterval(interval);stream.getTracks().forEach(t=>t.stop());return}try{let codes=await detector.detect(video);if(codes.length){document.querySelector('input[name=barcode]').value=codes[0].rawValue;clearInterval(interval);stream.getTracks().forEach(t=>t.stop());toast('Код зчитано')}}catch(_){}},500)}catch(e){toast('Немає доступу до камери')}}}
function wire(){document.querySelectorAll('[data-folder]').forEach(el=>el.onclick=()=>setPage('folders',el.dataset.folder));document.querySelectorAll('[data-openitem]').forEach(el=>el.onclick=()=>itemForm(el.dataset.openitem));document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>actions(el.dataset.action));if($('theme'))$('theme').onchange=async e=>{state.settings.theme=e.target.value;await save();render()};if($('currency'))$('currency').onchange=async e=>{state.settings.currency=e.target.value;await save();render()};for(let id of ['localSearch','globalSearch'])if($(id))$(id).oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let input=$(id);input.focus();input.setSelectionRange(pos,pos)}}
function actions(a){if(a==='new-item')itemForm();else if(a==='new-folder')folderForm();else if(a==='edit-folder')folderForm(folderId);else if(a==='up')setPage('folders',state.folders.find(f=>f.id===folderId)?.parentId||null);else if(a==='toggle-view'){view=view==='cards'?'table':'cards';render()}else if(a==='checklist')checklist();else if(a==='backup')backup();else if(a==='import')importBackup();else if(a==='share')share();else if(a==='scan')scan();else if(a==='external'){let q=encodeURIComponent(query||'колекційні фігурки Funko');window.open('https://www.google.com/search?q='+q,'_blank','noopener')}}
$('addBtn').onclick=()=>itemForm();$('share').onclick=share;
(async()=>{try{db=await openDB();let saved=await readDB();if(saved)state={folders:saved.folders||[],items:saved.items||[],settings:{theme:'purple',currency:'UAH',...(saved.settings||{})}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('root').innerHTML='<div class="empty">Не вдалося відкрити локальну базу: '+esc(e.message)+'</div>'}})();
</script></body></html>
